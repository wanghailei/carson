name: Carson CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    if: github.event_name == 'pull_request'
    name: Carson governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Refresh
        run: ruby exe/carson refresh

      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby exe/carson audit

      - name: Review gate
        env:
          GH_TOKEN: ${{ github.token }}
          CARSON_PR_NUMBER: ${{ github.event.pull_request.number }}
          CARSON_REVIEW_BOT_USERNAMES: "gemini-code-assist"
        run: ruby exe/carson review gate

  lint:
    name: Lint and guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Ruby syntax check
        run: |
          ruby -c exe/carson
          ruby -c lib/carson.rb

      - name: Ruby indentation guard
        run: ruby script/ruby_indentation_guard.rb

      - name: Legacy naming guard
        run: |
          if rg -n '\bcommon\b' README.md MANUAL.md API.md RELEASE.md docs lib script templates .github exe; then
            echo "legacy naming token detected" >&2
            exit 1
          fi

      - name: Legacy outsider naming guard
        run: |
          if rg -n -i '\bb[u][t][l][e][r]\b' README.md MANUAL.md API.md docs lib script templates .github exe test assets; then
            echo "legacy pre-rename token detected outside historical release notes" >&2
            exit 1
          fi

      - name: Local path privacy guard
        run: |
          if rg -n '(/(Users|home)/[A-Za-z0-9._-]+|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+)' README.md MANUAL.md API.md RELEASE.md docs lib script templates .github exe; then
            echo "machine-specific local path detected; use ~/ paths in docs and source examples" >&2
            exit 1
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install sqlite3
        run: gem install sqlite3 --no-document

      - name: Ruby unit tests
        run: ruby -Itest -e 'Dir.glob( "test/**/*_test.rb" ).sort.each { |path| require File.expand_path( path ) }'

  smoke-canary:
    name: PR canary smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Carson PR canary
        run: bash script/ci_smoke.sh --pr-canary

  smoke-full:
    name: Full smoke and review tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install sqlite3
        run: gem install sqlite3 --no-document

      - name: Carson full smoke tests
        run: bash script/ci_smoke.sh
